<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>🛡️ SlopShield</h1>
      <span id="backend" class="pill">model: …</span>
    </header>

    <section>
      <div class="label">Mode</div>
      <div class="seg" id="mode">
        <button data-mode="off">Off</button>
        <button data-mode="flag">Flag</button>
        <button data-mode="block">Block</button>
      </div>
    </section>

    <section>
      <label class="row"><input type="checkbox" id="fast" /> Fast mode <span class="hint">(text &amp; labels only, no vision)</span></label>
      <label class="row"><input type="checkbox" id="gpu" /> Use GPU <span class="hint">(recommended, ~10× faster; turn off if the browser stutters)</span></label>
      <div class="label">Sensitivity threshold: <b id="thVal"></b></div>
      <input type="range" id="threshold" min="0.3" max="0.95" step="0.05" />
      <div class="hint">Lower = flags more.</div>
    </section>

    <section>
      <div class="row"><button id="flush">Clear cached verdicts</button> <span id="flushMsg" class="hint"></span></div>
      <div class="hint">Only confident verdicts are kept between page loads. Clearing re-checks what's on screen.</div>
    </section>

    <section>
      <label class="row"><input type="checkbox" id="debug" /> Debug: show what the model saw</label>
      <div id="crops" hidden></div>
    </section>

    <footer>
      <div class="row"><span id="engine" class="pill">Desktop engine: checking…</span></div>
      <span class="hint">All analysis stays on this device. <span id="version"></span></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
