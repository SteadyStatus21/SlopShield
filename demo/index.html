<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Friendbook — demo feed</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #f0f2f5; font: 15px system-ui, "Segoe UI", sans-serif; color: #050505; }
      header { position: sticky; top: 0; z-index: 10; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); padding: 10px 16px; font-weight: 800; font-size: 22px; color: #1877f2; }
      main { max-width: 560px; margin: 16px auto; padding: 0 16px; }
      .post { background: #fff; border-radius: 10px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15); margin-bottom: 18px; overflow: hidden; }
      .who { display: flex; align-items: center; gap: 10px; padding: 12px 14px 6px; }
      .avatar { width: 38px; height: 38px; border-radius: 50%; background: #d8dadf; display: grid; place-items: center; font-weight: 700; color: #65676b; }
      .name { font-weight: 600; }
      .meta { font-size: 12px; color: #65676b; }
      .tag { display: inline-block; font-size: 12px; color: #65676b; background: #e4e6eb; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
      .caption { padding: 4px 14px 10px; line-height: 1.4; }
      video { display: block; width: 100%; max-height: 80vh; background: #000; }
      .actions { display: flex; justify-content: space-around; padding: 8px; color: #65676b; font-weight: 600; border-top: 1px solid #e4e6eb; }
      .missing { padding: 24px 14px; color: #65676b; font-size: 13px; background: #f7f8fa; }
      .note { font-size: 13px; color: #65676b; text-align: center; margin: 8px 0 24px; }
    </style>
  </head>
  <body>
    <header>friendbook</header>
    <main id="feed">
      <p class="note">Local demo feed for SlopShield. Put clips in <code>demo/videos/</code> and list them in <code>clips.js</code>.</p>
    </main>
    <script src="clips.js"></script>
    <script>
      const feed = document.getElementById('feed');
      for (const c of window.CLIPS) {
        const post = document.createElement('article');
        post.className = 'post';
        post.innerHTML = `
          <div class="who">
            <div class="avatar"></div>
            <div>
              <div class="name"></div>
              <div class="meta">${c.time || '2h'} · 🌐${c.platformLabel ? `<span class="tag">${c.platformLabel}</span>` : ''}</div>
            </div>
          </div>
          <div class="caption"></div>
          <video muted loop playsinline autoplay preload="metadata"></video>
          <div class="actions"><span>👍 Like</span><span>💬 Comment</span><span>↗ Share</span></div>`;
        post.querySelector('.avatar').textContent = c.author[0];
        post.querySelector('.name').textContent = c.author;
        post.querySelector('.caption').textContent = c.caption;
        const v = post.querySelector('video');
        v.src = `videos/${c.file}`;
        v.addEventListener('error', () => {
          const m = document.createElement('div');
          m.className = 'missing';
          m.textContent = `Missing clip: videos/${c.file}`;
          v.replaceWith(m);
        });
        feed.append(post);
      }
      // Autoplay only what's on screen, like real feeds.
      const io = new IntersectionObserver((es) => es.forEach((e) => (e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause())), { threshold: 0.5 });
      document.querySelectorAll('video').forEach((v) => io.observe(v));
    </script>
  </body>
</html>
